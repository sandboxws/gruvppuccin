k9s:
  body:
    fgColor: *text
    bgColor: *base
    logoColor: *sapphire
  prompt:
    fgColor: *text
    bgColor: *base
    suggestColor: *peach
  info:
    fgColor: *mauve
    sectionColor: *text
  help:
    fgColor: *text
    bgColor: *base
    keyColor: *mauve
    numKeyColor: *sapphire
    sectionColor: *green
  dialog:
    fgColor: *text
    bgColor: *base
    buttonFgColor: *base
    buttonBgColor: *mauve
    buttonFocusFgColor: *base
    buttonFocusBgColor: *green
    labelFgColor: *peach
    fieldFgColor: *text
  frame:
    border:
      fgColor: *overlay0
      focusColor: *green
    menu:
      fgColor: *text
      keyColor: *mauve
      numKeyColor: *mauve
    crumbs:
      fgColor: *base
      bgColor: *overlay0
      activeColor: *sapphire
    status:
      newColor: *sky
      modifyColor: *sapphire
      addColor: *green
      errorColor: *red
      highlightColor: *peach
      killColor: *overlay1
      completedColor: *overlay1
    title:
      fgColor: *text
      bgColor: *base
      highlightColor: *peach
      counterColor: *sapphire
      filterColor: *mauve
  views:
    charts:
      bgColor: *base
      defaultDialColors:
        - *sapphire
        - *red
      defaultChartColors:
        - *sapphire
        - *red
    table:
      fgColor: *text
      bgColor: *base
      cursorFgColor: *text
      cursorBgColor: *surface1
      header:
        fgColor: *text
        bgColor: *base
        sorterColor: *yellow
    xray:
      fgColor: *text
      bgColor: *base
      cursorColor: *surface1
      graphicColor: *sapphire
      showIcons: false
    yaml:
      keyColor: *mauve
      colonColor: *overlay2
      valueColor: *text
    logs:
      fgColor: *text
      bgColor: *base
      indicator:
        fgColor: *text
        bgColor: *base
        toggleOnColor: *green
        toggleOffColor: *red
