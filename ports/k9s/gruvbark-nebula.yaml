surface0:   &surface0  "#36313f"
surface1:   &surface1  "#403a46"
surface2:   &surface2  "#524a57"
overlay0:   &overlay0  "#6a616c"
overlay1:   &overlay1  "#8e8689"
overlay2:   &overlay2  "#999191"
subtext0:   &subtext0  "#a49b98"
subtext1:   &subtext1  "#d0d4c4"
rosewater:  &rosewater "#fc9822"
flamingo:   &flamingo  "#fd6e22"
pink:       &pink      "#e87163"
mauve:      &mauve     "#d3869b"
red:        &red       "#fb4934"
maroon:     &maroon    "#fc5c2b"
