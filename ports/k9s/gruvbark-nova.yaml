    suggestColor: *peach
  info:
    fgColor: *mauve
    sectionColor: *text
  help:
    fgColor: *text
    bgColor: *base
    keyColor: *mauve
    numKeyColor: *sapphire
    sectionColor: *green
  dialog:
    fgColor: *text
    bgColor: *base
    buttonFgColor: *base
    buttonBgColor: *mauve
    buttonFocusFgColor: *base
    buttonFocusBgColor: *green
    labelFgColor: *peach
    fieldFgColor: *text
  frame:
    border:
      fgColor: *overlay0
      focusColor: *green
    menu:
      fgColor: *text
      keyColor: *mauve
      numKeyColor: *mauve
    crumbs:
      fgColor: *base
      bgColor: *overlay0
      activeColor: *sapphire
