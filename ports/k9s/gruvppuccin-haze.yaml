        sorterColor: *yellow
    xray:
      fgColor: *text
      bgColor: *base
      cursorColor: *surface1
      graphicColor: *sapphire
      showIcons: false
    yaml:
      keyColor: *mauve
      colonColor: *overlay2
      valueColor: *text
    logs:
      fgColor: *text
      bgColor: *base
      indicator:
        fgColor: *text
        bgColor: *base
        toggleOnColor: *green
        toggleOffColor: *red
