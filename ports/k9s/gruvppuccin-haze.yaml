subtext0:   &subtext0  "#5e5667"
subtext1:   &subtext1  "#453f51"
rosewater:  &rosewater "#d67b20"
flamingo:   &flamingo  "#de5f25"
pink:       &pink      "#c04e58"
mauve:      &mauve     "#a44d85"
red:        &red       "#d93e32"
