# Nocturne — Gruvbox × Catppuccin blend for k9s
#
# Install as a named skin and reference it by stem (no extension):
#   k9s:
#     ui:
#       skin: gruvppuccin-nocturne
#
# k9s also supports per-cluster skins, so different contexts can wear
# different flavors — see the port README.

# ── Palette anchors ────────────────────────────
foreground: &text      "#e6e8ec"
background: &base      "#12151a"
mantle:     &mantle    "#0f1218"
crust:      &crust     "#0b0d10"
surface0:   &surface0  "#171b22"
surface1:   &surface1  "#232830"
surface2:   &surface2  "#2d333d"
overlay0:   &overlay0  "#3a414d"
overlay1:   &overlay1  "#4b5462"
overlay2:   &overlay2  "#5c6470"
subtext0:   &subtext0  "#8a93a0"
subtext1:   &subtext1  "#b6bcc6"
rosewater:  &rosewater "#f3dedc"
flamingo:   &flamingo  "#f5c2c2"
pink:       &pink      "#f472b6"
mauve:      &mauve     "#a78bfa"
red:        &red       "#fb7185"
maroon:     &maroon    "#fda4af"
peach:      &peach     "#38bdf8"
yellow:     &yellow    "#f5b454"
green:      &green     "#5eead4"
teal:       &teal      "#34d399"
sky:        &sky       "#7dd3fc"
sapphire:   &sapphire  "#7c6cf6"
blue:       &blue      "#7c6cf6"
lavender:   &lavender  "#c4b5fd"

k9s:
  body:
    fgColor: *text
    bgColor: *base
    logoColor: *sapphire
  prompt:
    fgColor: *text
    bgColor: *base
    suggestColor: *peach
  info:
    fgColor: *mauve
    sectionColor: *text
  help:
    fgColor: *text
    bgColor: *base
    keyColor: *mauve
    numKeyColor: *sapphire
    sectionColor: *green
  dialog:
    fgColor: *text
    bgColor: *base
    buttonFgColor: *base
    buttonBgColor: *mauve
    buttonFocusFgColor: *base
    buttonFocusBgColor: *green
    labelFgColor: *peach
    fieldFgColor: *text
  frame:
    border:
      fgColor: *overlay0
      focusColor: *green
    menu:
      fgColor: *text
      keyColor: *mauve
      numKeyColor: *mauve
    crumbs:
      fgColor: *base
      bgColor: *overlay0
      activeColor: *sapphire
    status:
      newColor: *sky
      modifyColor: *sapphire
      addColor: *green
      errorColor: *red
      highlightColor: *peach
      killColor: *overlay1
      completedColor: *overlay1
    title:
      fgColor: *text
      bgColor: *base
      highlightColor: *peach
      counterColor: *sapphire
      filterColor: *mauve
  views:
    charts:
      bgColor: *base
      defaultDialColors:
        - *sapphire
        - *red
      defaultChartColors:
        - *sapphire
        - *red
    table:
      fgColor: *text
      bgColor: *base
      cursorFgColor: *text
      cursorBgColor: *surface1
      header:
        fgColor: *text
        bgColor: *base
        sorterColor: *yellow
    xray:
      fgColor: *text
      bgColor: *base
      cursorColor: *surface1
      graphicColor: *sapphire
      showIcons: false
    yaml:
      keyColor: *mauve
      colonColor: *overlay2
      valueColor: *text
    logs:
      fgColor: *text
      bgColor: *base
      indicator:
        fgColor: *text
        bgColor: *base
        toggleOnColor: *green
        toggleOffColor: *red
