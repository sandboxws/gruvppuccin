name: Check generated ports

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate palette.json invariants
        run: python3 scripts/generate.py --validate-palette

      - name: Verify ports match palette.json
        run: python3 scripts/generate.py --check
